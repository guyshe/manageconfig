[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manageconfig"
dependencies = [
  'PyYAML >= 3.10'
]

version = "1.1.2"
authors = [
  {name="Guyshe"},
]
description = "Small package for working with config files"
readme = "README.md"
requires-python = ">=3"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
"Homepage" = "https://github.com/guyshe/manageconfig"

[tool.ruff]
extend-exclude = [
  ".tox",
  ".xdg",
  "dist",
  "venv",
  "manageconfig.egg-info",
]
